services:
  app:
    build:
      context: ./saas
      dockerfile: Dockerfile

    image: ps-tenant-php85

    working_dir: /var/www/html

    volumes:
      - ./saas:/var/www/html

    ports:
      - "8000:8000"

    environment:
      APP_ENV: local
      APP_DEBUG: "true"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: saas_db
      DB_USERNAME: saas_user
      DB_PASSWORD: secret_pass

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    command: php artisan serve --host=0.0.0.0 --port=8000

    restart: unless-stopped

  db:
    image: mysql:8.0

    environment:
      MYSQL_DATABASE: saas_db
      MYSQL_USER: saas_user
      MYSQL_PASSWORD: secret_pass
      MYSQL_ROOT_PASSWORD: secret_root_pass

    ports:
      - "3307:3306"

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

volumes:
  db_data:
